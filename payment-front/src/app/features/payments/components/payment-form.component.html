<section class="form-card"><div class="section-heading"><span class="section-number">02</span><div><p class="kicker">NEW TRANSACTION</p><h2>Create payment</h2></div></div><form [formGroup]="form" (ngSubmit)="submit()" novalidate><div class="field full"><label for="correlationId">Correlation ID</label><input id="correlationId" formControlName="correlationId" readonly></div><div class="form-grid"><div class="field"><label for="amount">Amount</label><input id="amount" type="number" min="0.01" step="0.01" formControlName="amount">@if (form.controls.amount.touched && form.controls.amount.invalid) {<small>Enter an amount greater than zero.</small>}</div><div class="field"><label for="currency">Currency</label><select id="currency" formControlName="currency">@for (currency of currencies; track currency) {<option [value]="currency">{{ currency }}</option>}</select></div></div><div class="field full"><label for="accountId">Account ID</label><input id="accountId" formControlName="accountId" readonly></div>@if (errorMessage) {<div class="form-alert error" role="alert">{{ errorMessage }}</div>}@if (successMessage) {<div class="form-alert success" role="status">{{ successMessage }}</div>}<button class="submit-button" type="submit" [disabled]="isSubmitting">{{ isSubmitting ? 'Creating...' : 'Create payment' }} <span aria-hidden="true">+</span></button></form></section>
